<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#6b11ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="laser-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d5a" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <style>
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes scan-line {
        0% { transform: translateY(-100px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes float-badge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dash-flow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .radar {
        transform-origin: 980px 190px;
        animation: radar-sweep 8s linear infinite;
      }
      .shield-icon {
        transform-origin: 180px 190px;
        animation: float-badge 4s ease-in-out infinite;
      }
      .glowing-core {
        transform-origin: 180px 190px;
        animation: pulse-glow 3s ease-in-out infinite;
      }
      .scan-beam {
        animation: scan-line 5s linear infinite;
      }
      .connecting-line {
        stroke-dasharray: 6 6;
        animation: dash-flow 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-gradient)" />
  <rect width="1200" height="380" rx="16" fill="url(#cyber-grid)" />

  <!-- Ambient Glow Spots -->
  <circle cx="180" cy="190" r="140" fill="#6b11ff" opacity="0.15" filter="url(#glow-intense)" />
  <circle cx="980" cy="190" r="130" fill="#00f2fe" opacity="0.12" filter="url(#glow-intense)" />
  <circle cx="600" cy="80" r="180" fill="#ff007f" opacity="0.08" filter="url(#glow-intense)" />

  <!-- Scanner Sweep Line -->
  <g class="scan-beam">
    <rect x="0" y="0" width="1200" height="3" fill="url(#laser-glow)" filter="url(#glow)" />
  </g>

  <!-- Decorative Circuit Lines -->
  <g stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path class="connecting-line" d="M 50 50 H 300 L 350 100 H 850 L 900 50 H 1150" />
    <path class="connecting-line" d="M 50 330 H 280 L 340 270 H 860 L 920 330 H 1150" />
    <circle cx="50" cy="50" r="4" fill="#00f2fe" />
    <circle cx="1150" cy="50" r="4" fill="#00f2fe" />
    <circle cx="50" cy="330" r="4" fill="#ff007f" />
    <circle cx="1150" cy="330" r="4" fill="#ff007f" />
  </g>

  <!-- Left: Animated Security Shield Matrix -->
  <g class="shield-icon">
    <!-- Glowing core behind shield -->
    <circle class="glowing-core" cx="180" cy="190" r="70" fill="url(#shield-grad)" filter="url(#glow)" />

    <!-- Outer polygon frame -->
    <polygon points="180,105 245,140 245,215 180,265 115,215 115,140" fill="#0e172e" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Shield Symbol -->
    <path d="M 180 130 Q 215 130 225 155 Q 225 210 180 240 Q 135 210 135 155 Q 145 130 180 130 Z" fill="url(#shield-grad)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Lock / API Key Symbol inside shield -->
    <path d="M 172 175 V 167 A 8 8 0 0 1 188 167 V 175 M 167 175 H 193 V 200 H 167 Z" fill="#ffffff" fill-opacity="0.9" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="180" cy="186" r="2.5" fill="#6b11ff" />
    <path d="M 180 188 V 194" stroke="#6b11ff" stroke-width="2" stroke-linecap="round" />

    <!-- Orbiting particles -->
    <circle cx="180" cy="85" r="4" fill="#00f2fe" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 180 190" to="360 180 190" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="295" r="3.5" fill="#ff007f" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="0 180 190" to="-360 180 190" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Center: Title & Typography -->
  <!-- Top Tagline -->
  <g>
    <rect x="420" y="62" width="360" height="28" rx="14" fill="#14214d" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.6" />
    <text x="600" y="81" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="2.5">
      ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM
    </text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="152" font-family="'Montserrat', 'Segoe UI', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    AWESOME <tspan fill="url(#cyber-cyan)">API SECURITY</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="400" fill="#b0c4de" text-anchor="middle" letter-spacing="0.8">
    The Definitive Curated Guide to Modern API Protection, Discovery &amp; Testing
  </text>

  <!-- Capability Pills -->
  <g transform="translate(300, 230)">
    <!-- Pill 1: Discovery & Posture -->
    <rect x="0" y="0" width="135" height="34" rx="8" fill="#0e1738" stroke="#00f2fe" stroke-width="1.2" />
    <text x="67" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#00f2fe" text-anchor="middle">Discovery &amp; Posture</text>

    <!-- Pill 2: Threat Detection -->
    <rect x="147" y="0" width="140" height="34" rx="8" fill="#0e1738" stroke="#7928ca" stroke-width="1.2" />
    <text x="217" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Threat Detection</text>

    <!-- Pill 3: Runtime WAAP -->
    <rect x="299" y="0" width="135" height="34" rx="8" fill="#0e1738" stroke="#ff007f" stroke-width="1.2" />
    <text x="366" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#ff70a6" text-anchor="middle">Runtime WAAP</text>

    <!-- Pill 4: DAST & Fuzzing -->
    <rect x="446" y="0" width="145" height="34" rx="8" fill="#0e1738" stroke="#00f2fe" stroke-width="1.2" />
    <text x="518" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">DAST &amp; Fuzzing</text>
  </g>

  <!-- Bottom Metric Banner -->
  <g transform="translate(370, 290)">
    <text x="230" y="22" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#8892b0" text-anchor="middle">
      50+ Curated Tools • Transparent Pricing &amp; Limits • OWASP Top 10 Aligned
    </text>
  </g>

  <!-- Right: Radar & API Topology Animation -->
  <g transform="translate(980, 190)">
    <!-- Radar concentric circles -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#1f2d5a" stroke-width="1" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#1f2d5a" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1f2d5a" stroke-width="1" />
    <circle cx="0" cy="0" r="15" fill="#00f2fe" fill-opacity="0.2" />
    
    <!-- Crosshairs -->
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#1f2d5a" stroke-width="1" />
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#1f2d5a" stroke-width="1" />

    <!-- Sweeping Radar Beam -->
    <g class="radar">
      <path d="M 0 0 L 85 -35 A 90 90 0 0 0 0 -90 Z" fill="url(#cyber-cyan)" opacity="0.35" />
    </g>

    <!-- Detected API Node Blips -->
    <circle cx="-35" cy="-45" r="4.5" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="-35" y="-55" font-family="'Segoe UI', sans-serif" font-size="9" fill="#00f2fe" font-weight="600" text-anchor="middle">REST /graphql</text>

    <circle cx="50" cy="30" r="4" fill="#ff007f" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="50" y="45" font-family="'Segoe UI', sans-serif" font-size="9" fill="#ff007f" font-weight="600" text-anchor="middle">gRPC Auth</text>

    <circle cx="-40" cy="40" r="3.5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-40" y="55" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a855f7" font-weight="600" text-anchor="middle">JWT Spec</text>

    <circle cx="45" cy="-40" r="4" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <text x="45" y="-49" font-family="'Segoe UI', sans-serif" font-size="9" fill="#38bdf8" font-weight="600" text-anchor="middle">OAuth2</text>
  </g>
</svg>
